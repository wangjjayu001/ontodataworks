name: independent-workbench
services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    networks: [private]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${DATABASE_PASSWORD}@db:5432/workbench
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: http://127.0.0.1:19090,http://localhost:19090
      CODEX_BRIDGE_URL: http://host.docker.internal:19191
      CODEX_BRIDGE_TOKEN_FILE: /run/secrets/codex_bridge_token
    volumes:
      - ./local/codex-bridge.token:/run/secrets/codex_bridge_token:ro
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    networks: [private, connector]
  worker:
    build: ./backend
    command: [python, -m, app.agent_worker]
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${DATABASE_PASSWORD}@db:5432/workbench
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CODEX_BRIDGE_URL: http://host.docker.internal:19191
      CODEX_BRIDGE_TOKEN_FILE: /run/secrets/codex_bridge_token
    volumes:
      - ./local/codex-bridge.token:/run/secrets/codex_bridge_token:ro
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    networks: [private, connector]
  pipeline-worker:
    build: ./backend
    command: [python, -m, app.pipeline_worker]
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${DATABASE_PASSWORD}@db:5432/workbench
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    networks: [private, connector]
  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports: ["127.0.0.1:19090:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 128m
    networks: [private, connector]
volumes:
  platform-postgres:
networks:
  private: {internal: true}
  connector: {}
