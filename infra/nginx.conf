server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/api/workspaces/[0-9]+/semantic/(sources/[^/]+/archive|catalog-snapshots(?:/[^/]+/revisions)?)$ {
        client_max_body_size 12m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }
    location / {try_files $uri $uri/ /index.html;}
}
